# Local production-like stack:
#   1. create ./backend/.env from backend/.env.example (JWT_SECRET is required)
#   2. docker compose up --build
#   3. open http://localhost:3000
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_PATH: /data/safebite.db
      CORS_ORIGINS: http://localhost:3000
      RATELIMIT_STORAGE_URI: redis://redis:6379
    volumes:
      - safebite-data:/data
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  safebite-data:
